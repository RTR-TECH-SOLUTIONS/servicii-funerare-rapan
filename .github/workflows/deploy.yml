name: Publicare demo pe GitHub Pages

# Site-ul real rulează pe serviciifunerarebascov.ro (Enhance, publicat din GitHub, vezi DEPLOY.md). Workflow-ul ține doar demo-ul
# de pe https://demo.mrwebsites.ro/servicii-funerare-rapan/: alt site/base și robots.txt care interzice indexarea,
# ca demo-ul să nu concureze pe Google cu domeniul real (paginile primesc și meta noindex, vezi Layout.astro).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Blochează indexarea demo-ului
        run: printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
      - run: npm run build
        env:
          SITE_URL: https://demo.mrwebsites.ro
          SITE_BASE: /servicii-funerare-rapan
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
